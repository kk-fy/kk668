<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>HEIMAZS - 工作台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei";
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid #e4e7ed;
      padding: 20px 0;
    }
    .logo {
      font-size: 24px;
      color: #409eff;
      font-weight: bold;
      padding: 0 20px 24px;
    }
    .menu-item {
      padding: 12px 20px;
      cursor: pointer;
      color: #333;
    }
    .menu-item.active {
      background: #ecf5ff;
      color: #409eff;
    }
    .menu-sub {
      padding-left: 40px;
      font-size: 14px;
    }
    .main {
      flex: 1;
      background: #f5f7fa;
      padding: 20px;
    }
    .header-right {
      text-align: right;
      margin-bottom: 16px;
    }
    .card-wrap {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #fff;
      padding: 24px;
      border-radius: 4px;
    }
    .stat-card .label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    .stat-card .num {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="sidebar">
    <div class="logo">HEIMAZS</div>
    <div class="menu-item active">工作台</div>
    <div class="menu-item">园区管理</div>
    <div class="menu-item">行车管理
      <div class="menu-sub menu-item" onclick="location.href='monthCard.html'">月卡管理</div>
      <div class="menu-sub menu-item">停车缴费管理</div>
      <div class="menu-sub menu-item">计费规则管理</div>
    </div>
    <div class="menu-item">物业费管理</div>
    <div class="menu-item">一体杆管理</div>
    <div class="menu-item">系统管理</div>
  </div>
  <div class="main">
    <div class="header-right">黑马管理员</div>
    <div class="card-wrap">
      <div class="stat-card">
        <div class="label">年度累计收费（元）</div>
        <div class="num" id="totalMoney">56233</div>
      </div>
      <div class="stat-card">
        <div class="label">入驻企业总数（个）</div>
        <div class="num" id="totalCompany">6</div>
      </div>
      <div class="stat-card">
        <div class="label">月卡车辆总数（辆）</div>
        <div class="num" id="totalCard">0</div>
      </div>
      <div class="stat-card">
        <div class="label">一体杆总数（台）</div>
        <div class="num" id="totalGate">48</div>
      </div>
    </div>
  </div>
</div>

<script src="card.js"></script>
<script>
window.onload = function() {
  renderIndex()
}
window.addEventListener('storage', function(e) {
  if (e.key === STORAGE_KEY) {
    renderIndex()
  }
})
</script>
</body>
</html>
