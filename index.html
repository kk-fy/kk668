<!DOCTYPE html>
<!-- 页面语言声明为简体中文，便于浏览器翻译与搜索引擎识别 -->
<html lang="zh-CN">

    <!-- 文档编码：UTF-8 可正常显示中文，避免乱码 -->

    <!-- 浏览器标签页标题 -->
    <title>校园资产管理系统</title>

    <link rel="stylesheet" crossorigin href="./assets/index-Br5ArAPC.css">

    <!-- Vue 应用挂载点：main.js 中 app.mount('#app') 会把整个 Vue 应用渲染到这个 div 内 -->
    <div id="app"></div>
    <!-- 以 ES Module 方式引入入口脚本；Vite 开发时支持热更新，构建时会被打包成带哈希的 js 文件 -->

</html>
